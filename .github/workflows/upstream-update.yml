name: Update upstream dependencies

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - uses: microsoft/apm-action@v1
        with:
          setup-only: 'true'

      - name: Check for upstream ref updates
        id: update
        run: |
          stale=0
          go run ./cmd/check-upstream || stale=1
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

      - name: Regenerate marketplace and commit
        if: steps.update.outputs.stale == '1'
        run: |
          apm pack
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apm.yml .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(deps): bump upstream find-docs ref"
          git push
