name: Update upstream dependencies

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - uses: microsoft/apm-action@v1
        with:
          setup-only: 'true'

      - name: Check for upstream ref updates
        id: update
        run: |
          go run ./cmd/check-upstream
          changed=0
          git diff --name-only -- apm.yml | grep -q . && changed=1
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Regenerate marketplace
        if: steps.update.outputs.changed == '1'
        run: apm pack

      - name: Commit and push
        if: steps.update.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apm.yml .claude-plugin/marketplace.json
          git commit -m "chore(deps): bump upstream find-docs ref"
          git push
