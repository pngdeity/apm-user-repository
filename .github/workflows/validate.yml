name: Validate marketplace

on:
  push:
    paths:
      - 'packages/**'
      - 'apm.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'apm.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - uses: extractions/setup-just@v4

      - uses: microsoft/apm-action@v1
        with:
          setup-only: 'true'

      - name: Run CI pipeline
        run: just ci
