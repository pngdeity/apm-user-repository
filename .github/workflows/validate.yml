name: Validate marketplace
on:
  push:
    paths:
      - 'packages/**'
      - 'apm.yml'
      - 'justfile'
      - 'schemas/**'
      - '.github/workflows/validate.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'packages/**'
      - 'apm.yml'
      - 'justfile'
      - 'schemas/**'
      - '.github/workflows/validate.yml'
      - 'README.md'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: extractions/setup-just@v4
      - uses: microsoft/apm-action@v1
        with:
          setup-only: 'true'
          apm-version: '0.16.1'
      - name: Install YAML validation tools
        run: |
          go install github.com/google/yamlfmt/cmd/yamlfmt@latest
          pip install check-jsonschema
      - name: Run CI pipeline
        run: just ci
      - name: Check dogfood lockfile is current
        run: |-
          apm install
          git diff --exit-code -- apm.lock.yaml .agents/ || \
            (echo "ERROR: dogfood files are stale — run 'just update-self' and commit" && exit 1)
      - name: Audit for tampering
        run: apm audit --ci --no-drift --format sarif --output apm-audit.sarif
        continue-on-error: true
        env:
          GITHUB_APM_PAT: ${{ secrets.APM_PAT }}
      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: apm-audit.sarif
