name: Validate marketplace
on:
  push:
    paths:
      - 'packages/**'
      - 'apm.yml'
      - 'justfile'
      - 'schemas/**'
      - '.github/workflows/validate.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'packages/**'
      - 'apm.yml'
      - 'justfile'
      - 'schemas/**'
      - '.github/workflows/validate.yml'
      - 'README.md'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: extractions/setup-just@v4
      - uses: microsoft/apm-action@v1
        with:
          setup-only: 'true'
      - name: Install YAML validation tools
        run: |
          go install github.com/google/yamlfmt/cmd/yamlfmt@latest
          pip install check-jsonschema
      - name: Run CI pipeline
        run: just ci
      - name: Check dogfood lockfile is current
        run: |-
          apm install
          git diff --exit-code -- apm.lock.yaml || \
            (echo "ERROR: apm.lock.yaml is stale — run 'just update-self' and commit" && exit 1)
